n><section class="card"><input id="search" class="search" placeholder="بحث سريع في أسماء الزبناء"><button id="new" class="new">+ زبون جديد</button><div id="list" class="client-list" style="margin-top:12px"></div></section><section id="editor" class="card editor hidden"><h2 id="editorTitle">معلومات الزبون</h2><label>إسم الكليان<input id="name"></label><label>إسم الشركة<input id="company"></label><label>ICE<input id="ice"></label><label>المدينة<input id="city"></label><label>رقم الهاتف<input id="phone"></label><button id="save" class="save">حفظ معلومات الزبون</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="stock-config.js"></script><script src="commercial-cloud-sync.js?v=20260817-95"></script><script>(()=>{const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),raw=sessionStorage.getItem('commercialUserName')||sessionStorage.getItem('commercialUserId')||'guest',scope=(p.get('scope')||raw).replace(/[^a-zA-Z0-9_-]/g,'_'),key='3d_peintures_clients_v1__'+scope;let clients=[],selected=-1;try{clients=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}const nameOf=c=>c.name||c.client||c.fullName||c.customerName||'';function render(){const q=$('search').value.trim().toLowerCase();const list=clients.map((c,i)=>({...c,_i:i})).filter(c=>nameOf(c).toLowerCase().includes(q));$('list').innerHTML=list.map(c=>`<button class="client-name" data-i="${c._i}">${String(nameOf(c)).replace(/[&<>]/g,'')}</button>`).join('')||'<div class="empty">مازال ما كاين حتى زبون.</div>';document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>open(+b.dataset.i))}function open(i){selected=i;const c=clients[i]||{};$('editor').classList.remove('hidden');$('editorTitle').textContent=i<0?'زبون جديد':'معلومات الزبون';$('name').value=nameOf(c);$('company').value=c.company||c.companyName||'';$('ice').value=c.ice||c.ICE||'';$('city').value=c.city||'';$('phone').value=c.phone||c.tel||'';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}function save(){const n=$('name').value.trim();if(!n){alert('كتب إسم الزبون أولاً');return}const old=selected>=0?clients[selected]:{};const c={...old,name:n,company:$('company').value.trim(),ice:$('ice').value.trim(),city:$('city').value.trim(),phone:$('phone').value.trim()};if(selected>=0)clients[selected]=c;else{clients.push(c);selected=clients.length-1}localStorage.setItem(key,JSON.stringify(clients));render();alert('تحفظات معلومات الزبون بنجاح');location.href='commercial.html?v=20260817-88'}$('search').oninput=render;$('new').onclick=()=>open(-1);$('save').onclick=save;$('back').onclick=()=>{if(history.length>1)history.back();else location.href='commercial.html?v=20260817-86'};render()})()</script></body></html>
