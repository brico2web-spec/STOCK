<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3D PEINTURES · Commercial</title>
<link rel="stylesheet" href="commercial.css?v=20260817-2">
</head>
<body>
<header class="topbar"><div class="brand"><b>3D</b> PEINTURES<small>COMMERCIAL STORE</small></div><div class="top-actions"><button id="menuBtn" class="icon-btn" aria-label="القائمة">☰</button><button id="customersBtn" class="icon-btn" aria-label="الزبناء">♙</button><button id="cartBtn" class="icon-btn" aria-label="السلة">🛒<i id="cartBadge">0</i></button></div></header>
<main class="page"><section class="hero"><div><span class="eyebrow">CATALOGUE PRODUITS</span><h1>منتوجاتنا</h1><p>اختار المنتوج، شوف التفاصيل، وحدد الكمية ديال الطلبية.</p></div><button id="refreshBtn" class="refresh-btn">تحديث المخزون</button></section><div id="categoryButtons" class="category-buttons"></div><div id="status" class="status">جاري تحميل المنتوجات...</div><section id="productsGrid" class="products-grid"></section><div id="empty" class="empty" hidden>مازال ما كاين حتى منتوج فالمخزون.</div></main>
<div id="productModal" class="modal" hidden><div class="modal-card product-modal"><button class="close" data-close="productModal">×</button><img id="modalImage" class="modal-image" alt=""><div class="modal-content"><span id="modalCategory" class="pill"></span><h2 id="modalName"></h2><div id="modalCode" class="code"></div><div id="modalStatus" class="modal-status"></div><div class="price-row"><strong id="modalPrice">0.00 درهم</strong><span id="modalPerBox"></span></div><label>عدد العلب<input id="modalBoxes" type="number" min="0" value="1"></label><label>عدد القطع<input id="modalPieces" type="number" min="0" value="0"></label><div id="modalTotal" class="modal-total">المجموع: 0.00 درهم</div><button id="addToCart" class="primary-btn">إضافة إلى السلة</button></div></div></div>
<aside id="cartPanel" class="side-panel"><div class="panel-head"><h2>سلة الطلبيات</h2><button data-close="cartPanel">×</button></div><div id="cartItems" class="panel-body"></div><div class="panel-footer"><div><span>المجموع</span><strong id="cartTotal">0.00 درهم</strong></div><button id="clearCart" class="secondary-btn">تفريغ السلة</button><button id="saveOrder" class="primary-btn">حفظ الطلبية</button></div></aside>
<aside id="customersPanel" class="side-panel"><div class="panel-head"><h2>الزبناء</h2><button data-close="customersPanel">×</button></div><div class="customer-search"><input id="customerSearch" placeholder="قلب على الزبون أو المدينة"><button id="addCustomer">+ زبون</button><button id="importCustomers">رفع ملف Excel</button><input id="customersExcel" type="file" accept=".xlsx,.xls,.csv" hidden></div><div id="customersList" class="panel-body"></div></aside>
<aside id="menuPanel" class="side-panel menu-panel"><div class="panel-head"><h2>القائمة</h2><button data-close="menuPanel">×</button></div><div class="panel-body menu-actions"><button id="editProductsBtn" class="menu-action">تعديل المنتوجات</button><button id="menuCustomersBtn" class="menu-action">الزبناء</button><button id="menuOrdersBtn" class="menu-action">الطلبيات</button></div></aside>
<aside id="ordersPanel" class="side-panel"><div class="panel-head"><h2>الطلبيات</h2><button data-close="ordersPanel">×</button></div><div id="ordersList" class="panel-body"></div></aside>
<div id="priceModal" class="modal" hidden><div class="modal-card product-modal"><button class="close" data-close="priceModal">×</button><div class="modal-content"><span class="pill">إدارة الثمن</span><h2 id="priceProductName">تعديل ثمن المنتوج</h2><label>الثمن الجديد<input id="newProductPrice" type="number" min="0" step="0.01"></label><label>ثمن الكمية الكبيرة<input id="bulkProductPrice" type="number" min="0" step="0.01"></label><button id="saveProductPrice" class="primary-btn">حفظ الثمن</button></div></div></div>
<div id="shade" class="shade" hidden></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="stock-config.js"></script><script src="commercial.js?v=20260817-2"></script>
</body></html>
