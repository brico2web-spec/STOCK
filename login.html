<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06152f"><title>3D PEINTURES · تسجيل الدخول</title>
<style>
:root{font-family:Arial,"Noto Sans Arabic",sans-serif;color:#fff;background:#06152f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#1d4d7d 0,#06152f 44%,#030b1d 100%)}.wrap{width:min(94vw,460px);padding:24px 18px}.brand{text-align:center;font-size:clamp(28px,8vw,48px);font-weight:900;letter-spacing:2px}.brand span{color:#e5bf52}.subtitle{text-align:center;color:#b8c7d9;letter-spacing:2px;font-size:12px;margin:8px 0 24px}.login-card{border:1px solid #ffffff36;border-radius:28px;padding:26px 20px;background:#ffffff12;backdrop-filter:blur(14px);box-shadow:0 22px 60px #0005}.target{display:flex;align-items:center;gap:10px;color:#f1ca62;font-size:21px;font-weight:800;margin-bottom:22px}.target.manager{color:#78efc2}.target-icon{font-size:32px}label{display:block;color:#dbe6f3;font-weight:700;margin:15px 0 7px}input{width:100%;padding:16px 15px;border-radius:15px;border:1px solid #ffffff3d;background:#06152f99;color:#fff;font-size:18px;outline:none}input:focus{border-color:#e5bf52;box-shadow:0 0 0 3px #e5bf5226}.submit{width:100%;margin-top:22px;border:0;border-radius:15px;padding:16px;background:linear-gradient(135deg,#d9b14b,#f4d474);color:#06152f;font-size:18px;font-weight:900;cursor:pointer}.submit:disabled{opacity:.55}.back{display:block;text-align:center;margin-top:17px;color:#c4d0df;text-decoration:none}.error{min-height:24px;margin-top:14px;color:#ffb0b0;text-align:center;line-height:1.5}.hint{margin-top:20px;color:#92a8be;font-size:12px;text-align:center;line-height:1.6}
</style></head><body><main class="wrap"><div class="brand">3D <span>PEINTURES</span></div><div class="subtitle">تسجيل الدخول الآمن</div><section class="login-card"><div id="target" class="target"><span id="targetIcon" class="target-icon">🛍️</span><span id="targetTitle">دخول Commercial</span></div><form id="loginForm"><label for="username">اسم المستخدم</label><input id="username" autocomplete="username" required placeholder="مثال: zamzam"><label for="password">الكود السري</label><input id="password" type="password" autocomplete="current-password" required placeholder="دخل الكود السري"><button id="submit" class="submit" type="submit">دخول</button><div id="error" class="error" role="alert"></div></form><a class="back" href="index.html">رجوع لاختيار الواجهة</a></section><div class="hint">استعمل اسم المستخدم والكود اللي عطاك المدير. ما تدخلش البريد الداخلي ديال Supabase.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="stock-config.js"></script><script>
(function(){
 const params=new URLSearchParams(location.search),target=params.get('target')==='stock'?'stock':'commercial';
 const $=id=>document.getElementById(id), box=$('target');
 if(target==='stock'){box.classList.add('manager');$('targetIcon').textContent='📦';$('targetTitle').textContent='دخول رئيس المخزن';}
 const cfg=window.STOCK_CONFIG||{};const client=window.supabase?.createClient(cfg.url||'',cfg.anonKey||'');
 $('loginForm').addEventListener('submit',async e=>{e.preventDefault();const username=$('username').value.trim().toLowerCase(),password=$('password').value;const error=$('error'),submit=$('submit');error.textContent='';if(!username||!password){error.textContent='دخل اسم المستخدم والكود.';return}if(!client){error.textContent='إعدادات Supabase ناقصة.';return}submit.disabled=true;submit.textContent='جاري التحقق...';try{const result=await client.auth.signInWithPassword({email:username+'@stock.local',password});if(result.error)throw result.error;if(target==='commercial')sessionStorage.setItem('catalogAuthPassed','1');else sessionStorage.removeItem('catalogAuthPassed');location.replace(target==='stock'?'stock.html':'commercial.html');}catch(err){error.textContent=err?.message?.includes('Invalid login credentials')?'اسم المستخدم أو الكود غير صحيح.':'تعذر الدخول حالياً. تأكد من الاتصال والمعطيات.';submit.disabled=false;submit.textContent='دخول';}});
})();</script></body></html>
