<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فواتير الشركة · 3D PEINTURES</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#17375e;font-family:Arial,"Noto Sans Arabic",sans-serif}header{background:#0b376a;color:#fff;padding:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:900;font-size:20px;flex:1}.brand small{display:block;font-size:9px;letter-spacing:3px;color:#dbe8f5}.back{background:#fff;color:#0b376a;border:0;border-radius:11px;padding:10px 16px;font-weight:900;font-size:16px}h1{width:100%;margin:8px 0 0;font-size:26px}header p{width:100%;margin:0;color:#dbe8f5}main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:0 5px 20px #17375e16}.form-card{border-top:6px solid #0b376a}h2{margin:0 0 14px}label{display:block;font-weight:800;margin:13px 0}input{display:block;width:100%;margin-top:6px;padding:14px;border:1px solid #ccd7e5;border-radius:11px;font-size:17px}#save{width:100%;padding:15px;border:0;border-radius:11px;background:#16803c;color:#fff;font-weight:900;font-size:18px;margin-top:10px}.archive-card{background:#fff9ed;border:2px solid #d97706}.archive-card h2{color:#9a4c00}.archive-head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.archive-head input{max-width:300px}.record{background:#fff;border-right:6px solid #d97706;border-radius:12px;padding:13px;margin-top:11px}.record h3{margin:0 0 8px}.record p{margin:6px 0;color:#526579}.record button{border:0;border-radius:9px;padding:10px 13px;background:#0b376a;color:#fff;font-weight:800;margin:4px 0}.record .delete{background:#b42318}.suggestions{position:relative;margin-top:-8px;margin-bottom:6px}.suggestions button{display:block;width:100%;border:1px solid #d5e1ee;background:#eef5ff;color:#17375e;text-align:right;padding:12px;border-radius:9px;font-weight:800;margin-top:5px}.empty{text-align:center;padding:30px;color:#64748b}@media(max-width:560px){h1{font-size:23px}.archive-head{display:block}.archive-head input{max-width:none}} </style></head><body><header><div class="brand">3D PEINTURES<small>COMMERCIAL STORE</small></div><button class="back" id="back">رجوع</button><h1>فواتير الشركة</h1><p>صفحة مستقلة لطلب فاتورة وإرسالها إلى الإدارة</p></header><main><section class="card form-card"><h2>طلب فاتورة جديدة</h2><label>إسم الكليان<input id="client" autocomplete="off" placeholder="كتب إسم الكليان"><div id="suggestions" class="suggestions"></div></label><label>ICE<input id="ice" inputmode="numeric" placeholder="كتب ICE"></label><label>المدينة<input id="city" placeholder="كتب المدينة"></label><label>إسم الشركة<input id="company" placeholder="كتب إسم الشركة"></label><label>رقم الهاتف<input id="phone" inputmode="tel" placeholder="رقم الهاتف"></label><button id="save">حفظ وإرسال إلى الإدارة</button></section><section class="card archive-card"><div class="archive-head"><h2>أرشيف الفواتير المرسلة</h2><input id="search" placeholder="بحث سريع"></div><div id="list"></div></section></main><script>(()=>{const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),raw=sessionStorage.getItem('commercialUserName')||sessionStorage.getItem('commercialUserId')||'guest',scope=(p.get('scope')||raw).replace(/[^a-zA-Z0-9_-]/g,'_'),clientKey='3d_peintures_clients_v1__'+scope,key='3d_peintures_company_invoices_standalone__'+scope,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),now=()=>new Date().toLocaleString('fr-FR');let data=[],clients=[];try{data=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}try{clients=JSON.parse(localStorage.getItem(clientKey)||'[]')}catch(e){}const cname=c=>c.name||c.client||c.fullName||c.customerName||'',company=c=>c.company||c.companyName||'',phone=c=>c.phone||c.tel||'';function fill(c){$('client').value=cname(c);$('company').value=company(c);$('ice').value=c.ice||c.ICE||'';$('city').value=c.city||'';$('phone').value=phone(c);$('suggestions').innerHTML=''}function suggest(){const q=$('client').value.trim().toLowerCase();if(!q){$('suggestions').innerHTML='';return}const found=clients.filter(c=>cname(c).toLowerCase().includes(q)).slice(0,8);$('suggestions').innerHTML=found.map((c,i)=>`<button type="button" data-client="${i}">${esc(cname(c))}${company(c)?' · '+esc(company(c)):''}</button>`).join('');document.querySelectorAll('[data-client]').forEach(b=>b.onclick=()=>fill(found[+b.dataset.client]))}function invoiceText(r){return `3D PEINTURES
طلب فاتورة من الشركة
إسم الكليان: ${r.client}
إسم الشركة: ${r.company}
ICE: ${r.ice}
المدينة: ${r.city}
رقم الهاتف: ${r.phone}
تاريخ الإرسال: ${r.sentAt}`}function drawInvoice(r){return new Promise(resolve=>{const c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=1000;c.height=760;ctx.fillStyle='#f4f7fb';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#0b376a';ctx.fillRect(0,0,c.width,145);ctx.direction='rtl';ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='bold 40px Arial';ctx.fillText('3D PEINTURES',940,55);ctx.font='bold 23px Arial';ctx.fillText('طلب فاتورة من الشركة',940,98);ctx.fillStyle='#17375e';ctx.font='bold 28px Arial';ctx.fillText('معلومات الزبون',940,205);const rows=[['إسم الكليان',r.client],['إسم الشركة',r.company],['ICE',r.ice],['المدينة',r.city],['رقم الهاتف',r.phone],['تاريخ الإرسال',r.sentAt]];let y=260;rows.forEach((row,i)=>{ctx.fillStyle=i%2?'#eef5ff':'#fff';ctx.fillRect(60,y-38,880,58);ctx.fillStyle='#17375e';ctx.font='bold 22px Arial';ctx.fillText(row[0],900,y);ctx.font='24px Arial';ctx.fillText(row[1]||'—',610,y);y+=68});ctx.fillStyle='#64748b';ctx.font='18px Arial';ctx.fillText('المرجو إنجاز الفاتورة في أقرب وقت.',940,710);c.toBlob(b=>resolve(b),'image/png')})}async function share(r){const blob=await drawInvoice(r);const file=new File([blob],`facture-${(r.client||'client').replace(/[^a-zA-Z0-9_-]/g,'_')}.png`,{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({title:'طلب فاتورة من الشركة',text:'طلب فاتورة من 3D PEINTURES',files:[file]});return}catch(e){if(e.name==='AbortError')return}}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);alert('توجد الصورة في التحميلات، يمكن إرسالها إلى الإدارة')}function render(){const q=$('search').value.trim().toLowerCase();$('list').innerHTML=data.filter(r=>`${r.client} ${r.ice} ${r.city} ${r.company} ${r.phone}`.toLowerCase().includes(q)).map((r,i)=>`<article class="record"><h3>${esc(r.client)}</h3><p><b>إسم الشركة:</b> ${esc(r.company)}</p><p><b>ICE:</b> ${esc(r.ice)}</p><p><b>المدينة:</b> ${esc(r.city)}</p><p><b>رقم الهاتف:</b> ${esc(r.phone)}</p><p><b>تاريخ الإرسال:</b> ${esc(r.sentAt)}</p><button data-send="${i}">إرسال الصورة من جديد</button><button class="delete" data-delete="${i}">حذف فاتورة تم تسليمها</button></article>`).join('')||'<div class="empty">مازال ما كايناش فواتير مرسلة.</div>';document.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>share(data[+b.dataset.send]));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeInvoice(+b.dataset.delete))}function removeInvoice(i){if(!confirm('واش متأكد أن هاد الفاتورة تسلمات وبغيتي تحذفها من الأرشيف؟'))return;data.splice(i,1);localStorage.setItem(key,JSON.stringify(data));render();alert('تحذفات الفاتورة من الأرشيف')}function save(){const r={client:$('client').value.trim(),company:$('company').value.trim(),ice:$('ice').value.trim(),city:$('city').value.trim(),phone:$('phone').value.trim(),sentAt:now()};if(!r.client||!r.ice||!r.city||!r.company){alert('عمر الخانات الإلزامية أولاً');return}data.unshift(r);localStorage.setItem(key,JSON.stringify(data));render();$('client').value=$('company').value=$('ice').value=$('city').value=$('phone').value='';$('suggestions').innerHTML='';share(r)}$('client').oninput=suggest;$('save').onclick=save;$('search').oninput=render;$('back').onclick=()=>{if(history.length>1)history.back();else location.href='commercial.html?v=20260817-89'};render()})()</script></body></html>
