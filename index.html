<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06152f">
  <title>3D PEINTURES · اختيار الواجهة</title>
  <style>
    :root{font-family:Arial,"Noto Sans Arabic",sans-serif;color:#fff;background:#06152f}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow-x:hidden;background:radial-gradient(circle at 20% 10%,#1d4d7d 0,#06152f 44%,#030b1d 100%)}
    .wrap{width:min(94vw,620px);padding:28px 18px;text-align:center}.brand{font-size:clamp(28px,8vw,52px);font-weight:900;letter-spacing:2px}.brand span{color:#e5bf52}.sub{margin:8px 0 30px;color:#b8c7d9;letter-spacing:3px;font-size:12px}
    .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.choice{position:relative;min-height:210px;border:1px solid #ffffff36;border-radius:28px;padding:26px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#fff;overflow:hidden;transition:.25s transform,.25s box-shadow;background:#ffffff12;backdrop-filter:blur(14px)}.choice:hover{transform:translateY(-6px);box-shadow:0 18px 40px #0005}.choice:before{content:"";position:absolute;inset:-40% 25% auto -30%;height:150px;border-radius:50%;background:#ffffff18;transform:rotate(-18deg)}.icon{font-size:48px;margin-bottom:16px;position:relative}.choice b{font-size:22px;position:relative}.choice small{margin-top:10px;color:#d6e0ee;line-height:1.6;position:relative}.commercial{border-color:#d8b14888;background:linear-gradient(145deg,#b8862022,#ffffff0e)}.commercial b{color:#f1ca62}.manager{border-color:#56c7a388;background:linear-gradient(145deg,#20b98122,#ffffff0e)}.manager b{color:#78efc2}.hint{margin-top:24px;color:#93a7be;font-size:12px}
    @media(max-width:480px){.choices{grid-template-columns:1fr}.choice{min-height:170px}.wrap{padding-top:50px}}
  </style>
</head>
<body><main class="wrap"><div class="brand">3D <span>PEINTURES</span></div><div class="sub">اختار الواجهة اللي بغيتي تدخل ليها</div><div class="choices"><a class="choice commercial" href="login.html?target=commercial"><div class="icon">🛍️</div><b>دخول Commercial</b><small>المنتجات · السلة · الطلبيات<br>الزبناء · الفواتير · الأقساط</small></a><a class="choice manager" href="login.html?target=stock"><div class="icon">📦</div><b>دخول رئيس المخزن</b><small>المخزون · دخول وخروج السلع<br>التحديثات والصلاحيات</small></a></div><div class="hint">3D PEINTURES · منصة واحدة بواجهتين</div></main></body></html>
